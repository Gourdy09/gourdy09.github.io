name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild periodically so newly published portfolio.settings files show up.
  schedule:
    - cron: '17 */6 * * *'
  # Lets a project repo trigger a rebuild right after you push (see docs/portfolio-settings.md).
  repository_dispatch:
    types: [portfolio-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Fail the build (keeping the live site untouched) if GitHub discovery fails,
          # instead of publishing a site with no projects.
          PORTFOLIO_STRICT: '1'
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
